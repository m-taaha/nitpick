services:
  postgres:
    image: postgres:18.6
    
    environment:
      POSTGRES_USER: nitpick
      POSTGRES_PASSWORD: nitpick
      POSTGRES_DB: nitpick

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
  


  redis:
    image: redis:8.10.2

    ports:
      - "6379:6379"



volumes:
  postgres_data:



